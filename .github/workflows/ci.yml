# The free rungs of Curmudgeon's evidence ladder, for every push and pull request: no model, no secrets, no login.
#   rung 0  claude plugin validate (strict, and the directory profile)
#   rung 1  the script tests on every supported Python
#   rung 2  golden tests for the scripted checks (eval/golden.py)
#   rung 3  replays of recorded review runs through today's counting scripts (eval/replay.py)
#   gate    the accept/kill gate's self-test (a verifier that refutes everything must fail it)
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Script tests (rung 1)
        shell: bash
        run: |
          # each failing test is also raised as an annotation, so it can be read from the run's summary and the API
          set +e; python plugin/tests/run_tests.py 2>&1 | tee tests.out; status=${PIPESTATUS[0]}
          grep -E '^FAIL' tests.out | head -20 | cut -c1-900 | sed 's/^/::error title=script test::/'
          grep -E '^SKIP' tests.out | head -20 | cut -c1-300 | sed 's/^/::warning title=script test not run here::/'
          exit $status
      - name: Golden tests (rung 2)
        run: python eval/golden.py
      - name: Replays (rung 3)
        run: python eval/replay.py
      - name: Gate self-test
        run: python eval/score.py --selftest
  windows:
    # the security database's Windows-only paths, run for real (plugin/tests/windows_checks.py)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Script tests on Windows (required for release since 4 Nov 2026, 03 §5.57 item 24)
        # The first 30 failures are reported as annotations; a failure fails the job. Tests that can't apply on native
        # Windows (POSIX modes, /proc, a shell-script git stand-in) are skipped, each with its reason.
        timeout-minutes: 25
        shell: bash
        run: |
          set +e; python plugin/tests/run_tests.py 2>&1 | tee tests.out; status=${PIPESTATUS[0]}
          grep -E '^FAIL' tests.out | head -30 | cut -c1-900 | sed 's/^/::warning title=script test on Windows::/'
          tail -n 1 tests.out | sed 's/^/::notice title=script tests on Windows::/'
          exit $status
      - name: How a hook finds Python on Windows (03 §5.57 item 21; measured, not yet a check)
        # Claude Code runs a hook's command in Git Bash, or in PowerShell when Git Bash isn't installed. This tries each
        # Python spelling in each shell, the way a hook would start it, and reports which ones run.
        continue-on-error: true
        shell: bash
        run: |
          printf 'import sys; print("ok", sys.version_info[:2])\n' > probe.py
          for py in python3 "py -3" python; do
            out=$(bash -c "$py probe.py" 2>&1 | tr -d '\r' | head -n1); echo "::notice title=Git Bash, $py::${out:-no output}"
            out=$(powershell.exe -NoProfile -Command "$py probe.py" 2>&1 | tr -d '\r' | head -n1); echo "::notice title=PowerShell 5.1, $py::${out:-no output}"
            out=$(pwsh -NoProfile -Command "$py probe.py" 2>&1 | tr -d '\r' | head -n1); echo "::notice title=PowerShell 7, $py::${out:-no output}"
          done
          out=$(powershell.exe -NoProfile -Command 'python3 probe.py; if (-not $?) { python probe.py }' 2>&1 | tr -d '\r' | head -n1); echo "::notice title=PowerShell 5.1, python3 then python::${out:-no output}"
      - name: Windows checks
        shell: bash
        run: |
          set +e; python plugin/tests/windows_checks.py 2>&1 | tee win.out; status=${PIPESTATUS[0]}
          grep -E '^(FAIL|ok|windows_checks)' win.out | cut -c1-900 | sed 's/^/::notice title=windows check::/'
          if [ $status -ne 0 ]; then tail -n 15 win.out | cut -c1-900 | sed 's/^/::error title=windows check output::/'; fi
          exit $status
  macos:
    # 03 §5.56 item 23: paths, links and hooks on macOS (case-insensitive file system by default). Required for release
    # since 4 Nov 2026 (03 §5.57 item 24).
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Script tests on macOS
        shell: bash
        run: |
          set +e; python plugin/tests/run_tests.py 2>&1 | tee tests.out; status=${PIPESTATUS[0]}
          grep -E '^FAIL' tests.out | head -30 | cut -c1-900 | sed 's/^/::warning title=script test on macOS::/'
          tail -n 1 tests.out | sed 's/^/::notice title=script tests on macOS::/'
          exit $status
  wsl2:
    # 03 §5.57 item 20: Claude Code runs on WSL2 (where its own sandbox works), so Curmudgeon is tested there too. Not a
    # required check until it has passed five runs in a row (whether WSL2 stays reliable on hosted runners is unconfirmed).
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: python3 git
      - name: Script tests, golden and replays in WSL2 (on WSL's own file system, not /mnt/d)
        shell: wsl-bash {0}
        run: |
          set -eo pipefail
          cp -r "$PWD" ~/repo && cd ~/repo  # the step starts in the checkout (under /mnt); Windows variables don't reach WSL unless WSLENV lists them
          python3 plugin/tests/run_tests.py 2>&1 | tee tests.out || { grep -E '^FAIL' tests.out | head -30 | cut -c1-900; exit 1; }
          python3 eval/golden.py && python3 eval/replay.py
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Claude Code (pinned; its postinstall puts the native binary in place; validation needs no login)
        run: npm install --global @anthropic-ai/claude-code@2.1.305
      - name: Validate the marketplace and the plugin (rung 0)
        env:
          DISABLE_TELEMETRY: "1"
          DISABLE_ERROR_REPORTING: "1"
        run: |
          export HOME="$(mktemp -d)"
          claude plugin validate --strict .
          claude plugin validate --strict plugin
          claude plugin validate --strict --profile directory plugin
