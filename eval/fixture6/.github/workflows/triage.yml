name: triage
on:
  pull_request_target:
    types: [opened, edited]
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Greet
        run: |
          echo "Thanks for: ${{ github.event.pull_request.title }}"
      - uses: someorg/labeler@v2
      - name: Only on open
        if: ${{ github.event.action }} == 'opened'
        run: echo opened
