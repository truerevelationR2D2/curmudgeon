apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          image: "registry.example/web:1.4.0"
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
          resources:
            limits: {cpu: "1", memory: 512Mi}
