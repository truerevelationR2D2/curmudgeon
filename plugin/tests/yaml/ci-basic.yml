name: ci
on:
  push:
    branches: [main, "release/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4
      with: {fetch-depth: 0}
    - name: Run tests
      run: |
        python -m pip install -e .
        pytest -q
    - name: Folded
      run: >
        echo one
        two

        three
      env:
        TOKEN: ${{ secrets.TOKEN }}
        EMPTY:
